# Sample configuration.
#
# `load_auto_config()` searches, in order of increasing precedence:
#   /etc/<app>/config.{json,yaml,yml,toml}
#   ~/.<app>/config.{json,yaml,yml,toml}
#   ./config/config.{json,yaml,yml,toml}
#   ./config.{json,yaml,yml,toml}
#
# Every section is optional: an application with no config file starts on the framework
# defaults (port 19009, no database, `info` logging).

web:
  server:
    port: 19009
    # Prefixed to every route, so a handler registered at `/users` is served at
    # `/api/users`.
    # contextPath: /api
    # Static files served when no route matches. Each directory *is* the URL root:
    # `./public/report.csv` is served at `/report.csv`, not `/public/report.csv`.
    # locations: ["./public"]
    # Served to browsers for unmatched navigations, so a single-page app keeps its deep
    # links.
    # page404: index.html
    # `0` means the 10 MiB default, `-1` means unlimited. Raise it to accept uploads
    # larger than 10 MiB.
    maxBodySize: 0

    # How long a client may take to send its request headers, in seconds. `0` means 15.
    # A client that dribbles them is disconnected instead of holding a connection open.
    readHeaderTimeout: 0
    # How long a client may take to send the request *body*, in seconds. `0` means no
    # limit. Only reading is bounded — a slow response (SSE, WebSocket) is never cut off.
    readTimeout: 0
    # Ceiling on the request head, in bytes. `0` means 16 KiB. Values below 8 KiB are
    # raised to it: that is the smallest read buffer an HTTP/1 connection can use.
    maxHeaderBytes: 0

    # HTTPS. Two ways to get a certificate, and the first one configured wins.
    # ssl:
    #   enabled: true
    #   # Names to obtain and renew automatically over ACME (Let's Encrypt). The challenge
    #   # is answered on TLS-ALPN-01, so no separate port 80 server is needed.
    #   hosts: ["example.com", "www.example.com"]
    #   # Some authorities require a contact address.
    #   # email: ops@example.com
    #   # Where obtained certificates are cached. Defaults to ./auto_cert.
    #   # cacheDir: ./auto_cert
    #
    #   # Or bring your own. These are re-read when the files change, so a renewal written
    #   # by certbot takes effect without a restart. Takes precedence over `hosts`.
    #   certs:
    #     - certFile: /etc/ssl/example.com.crt
    #       keyFile: /etc/ssl/example.com.key

    # Cross-origin policy. Omit the section and no CORS headers are sent at all, which is
    # the safe default. Configured, it is applied outside the router, so a preflight
    # OPTIONS is answered even though it matches no route.
    # cors:
    #   allowedOrigins: ["https://app.example.com"]   # or ["*"]
    #   allowedMethods: [GET, POST, PUT, DELETE]
    #   allowedHeaders: [content-type, authorization]
    #   exposedHeaders: []
    #   allowCredentials: true
    #   maxAge: 3600
    # How much of one uploaded file is held in memory before it spills to a temporary
    # file. `0` means the 1 MiB default. This is what keeps a big upload costing disk
    # space rather than resident memory.
    maxUploadMemory: 0

  # Extra servers, each with its own controllers and port. The port here overrides
  # whatever the code asked for, so a deployment can move a group without a rebuild.
  # restGroups:
  #   admin:
  #     port: 19011
  #     contextPath: /admin

# The `db` section is read by `db::connect_from_config`. Leave it out to run without a
# database — `Context::db()` then reports a helpful error instead of failing at startup.
#
# SQLite:
# db:
#   type: sqlite
#   path: ./data.db
#
# MySQL:
# db:
#   type: mysql
#   host: localhost
#   port: 3306
#   user: root
#   password: secret
#   database: mydb
#   maxConnections: 20
#
# Anything else sea-orm can reach — ClickHouse, SQL Server — goes through a raw url:
# db:
#   type: clickhouse
#   url: clickhouse://user:pass@localhost:9000/default

log:
  # A `tracing` filter directive: `info`, `debug`, `my_app=debug,tower=warn`.
  level: info
  format: text
  ansi: true
  # Also append to a rotating file. The directory is created if it is missing.
  # path: ./logs/app.log
