[package]
name = "rust-web-frame"
version = "0.1.0"
edition = "2024"
description = "A Rust web framework with declarative per-route metadata, a DI container and a zero-boilerplate generic ORM"
license = "Apache-2.0"
repository = "https://github.com/chuccp/rust-web-frame"
readme = "README.md"
keywords = ["web", "framework", "orm", "axum", "sea-orm"]
categories = ["web-programming::http-server"]

[lib]
name = "rust_web_frame"
path = "src/lib.rs"

[dependencies]
# HTTP layer (the "Gin" of this framework)
axum = { version = "0.8.9", features = ["ws", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
# `fs` serves static files with range and conditional-request support; `catch-panic`
# keeps a panicking handler from taking the connection down with it.
tower-http = { version = "0.7.1", features = ["fs", "catch-panic", "cors"] }

# Async runtime
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["rt"] }
futures-util = "0.3"

# Data layer (the "GORM" of this framework)
sea-orm = { version = "2", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "with-chrono",
    "with-json",
] }

# Serialization / config
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
serde_yaml = "0.9"

# Logging (the "Zap" of this framework)
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# Misc
async-trait = "0.1.92"
thiserror = "2.0.21"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1.12.1"
percent-encoding = "2.3.2"
matchit = "0.9.2"
multer = "3.1.0"
tempfile = "3"
hyper = { version = "1.12.0", features = ["http1", "http2", "server", "client"] }
# `client-legacy` is the pooled client the reverse proxy forwards with; `http1` is the
# server side of the same crate.
hyper-util = { version = "0.1.21", features = [
    "tokio",
    "server-auto",
    "server",
    "service",
    "client-legacy",
    "http1",
] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2.2.0"
rcgen = "0.14.10"
rustls-acme = { version = "0.15.4", default-features = false, features = ["ring", "tokio", "webpki-roots"] }
x509-parser = "0.18.1"
moka = { version = "0.12.16", features = ["future", "sync"] }
# The reverse proxy's client side. `ring` and `webpki-tokio` rather than hyper-rustls'
# defaults, which would install `aws-lc-rs` next to the `ring` pinned below.
hyper-rustls = { version = "0.27.10", default-features = false, features = [
    "ring",
    "http1",
    "tls12",
    "logging",
    "webpki-tokio",
] }
# Random operands for the arithmetic captcha.
getrandom = "0.4"
base64 = "0.23.1"
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp", "connection-manager"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
qrcode = { version = "0.14.1", default-features = false, features = ["image", "svg"] }
cron = "0.17.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
# sqlx's slow-statement logging takes a `log::LevelFilter`, which is what `sqlLoggingLevel`
# and `slowStatementThreshold` are written in.
log = "0.4.34"

[features]
default = ["sqlite"]
sqlite = ["sea-orm/sqlx-sqlite"]
mysql = ["sea-orm/sqlx-mysql"]
postgres = ["sea-orm/sqlx-postgres"]

[dev-dependencies]
futures-util = "0.3"
tempfile = "3"
tokio-tungstenite = "0.30.0"
