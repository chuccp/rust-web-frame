[package]
name = "rust-web-frame"
version = "0.1.0"
edition = "2024"
description = "A Rust web framework with declarative per-route metadata, a DI container and a zero-boilerplate generic ORM"
license = "Apache-2.0"
repository = "https://github.com/chuccp/rust-web-frame"
readme = "README.md"
keywords = ["web", "framework", "orm", "axum", "sea-orm"]
categories = ["web-programming::http-server"]

[lib]
name = "rust_web_frame"
path = "src/lib.rs"

[dependencies]
# HTTP layer (the "Gin" of this framework)
axum = { version = "0.8.9", features = ["ws", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "cors", "limit"] }

# Async runtime
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["rt"] }
futures-util = "0.3"

# Data layer (the "GORM" of this framework)
sea-orm = { version = "2", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "with-chrono",
    "with-json",
] }

# Serialization / config
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
serde_yaml = "0.9"

# Logging (the "Zap" of this framework)
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# Misc
async-trait = "0.1.92"
thiserror = "2.0.21"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1.12.1"
percent-encoding = "2.3.2"
matchit = "0.9.2"
multer = "3.1.0"
tempfile = "3"

[features]
default = ["sqlite"]
sqlite = ["sea-orm/sqlx-sqlite"]
mysql = ["sea-orm/sqlx-mysql"]
postgres = ["sea-orm/sqlx-postgres"]

[dev-dependencies]
tempfile = "3"
